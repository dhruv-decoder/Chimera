# Render.com blueprint - one monolithic web service (API + static frontend).
# The multi-stage Dockerfile builds the Next.js static export and serves it from
# FastAPI on the same origin, so there is a single URL and no separate frontend
# deploy. The trained detector + reports are committed under data/artifacts, so
# nothing trains at deploy time. Set GROQ_API_KEY in the dashboard to enable live
# ideation (optional; the offline planner works without it).
services:
  - type: web
    name: chimera
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
