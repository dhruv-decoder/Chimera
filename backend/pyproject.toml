[project]
name = "chimera"
version = "0.1.0"
description = "Chimera - a closed-loop adversarial lab for GenAI-era payment fraud: identify, generate, defend."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "networkx>=3.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "orjson>=3.10",
    "rich>=13.7",
]

[project.optional-dependencies]
# Agentic layer. Optional so the core simulator/detector installs and runs
# with zero LLM dependencies; the ideation/evasion agents degrade to a
# deterministic offline planner when these (or an API key) are absent.
agents = [
    "langgraph>=1.2",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
]
# Local-only extras for richer plots and the walkthrough figures.
dev = [
    "pytest>=8.3",
    "matplotlib>=3.9",
    "shap>=0.46",
    "python-pptx>=0.6.23",
    "xgboost>=2.0",   # the XGBoost baseline in scripts/benchmark_baselines.py
]
# Graph neural network benchmark (optional; heavy). CPU-only torch is fine.
gnn = [
    "torch>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chimera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
